<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet"></head><body class="login-page"><div class="login-box"><div class="brand-mark">H</div><h1>Hackathon Tracker</h1><p class="text-muted">Organizer sign in</p><form method="post"><label class="form-label">Username</label><input class="form-control mb-3" name="username" required autofocus><label class="form-label">Password</label><input class="form-control mb-4" type="password" name="password" required><button class="btn btn-teal w-100">Sign in</button></form>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-danger mt-3">{{ message }}</div>{% endfor %}{% endwith %}</div></body></html>
