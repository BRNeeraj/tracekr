<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title or event_name }}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet"></head>
<body><nav class="navbar navbar-expand-lg navbar-dark bg-ink"><div class="container"><a class="navbar-brand fw-bold" href="{{ url_for('dashboard') }}">{{ event_name }}</a><button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">☰</button><div id="nav" class="collapse navbar-collapse"><div class="navbar-nav me-auto"><a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a><a class="nav-link scanner-link" href="{{ url_for('scanner') }}">▣ Scanner</a><a class="nav-link" href="{{ url_for('participants') }}">Participants</a><a class="nav-link" href="{{ url_for('services') }}">Services</a><a class="nav-link" href="{{ url_for('reports') }}">Reports</a></div><a class="nav-link text-white" href="{{ url_for('logout') }}">Logout</a></div></div></nav><main class="container py-4">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{ 'danger' if category=='error' else category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>{% block scripts %}{% endblock %}</body></html>
