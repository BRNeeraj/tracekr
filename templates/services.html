{% extends 'base.html' %}{% block content %}<div class="section-heading"><div><p class="eyebrow">Configuration</p><h1>Services</h1></div><form class="d-flex gap-2" method="post"><input class="form-control" name="name" placeholder="New service name" required><button class="btn btn-teal">Add</button></form></div><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Service</th><th>Status</th><th>Created</th><th></th></tr></thead><tbody>{% for service in services %}<tr><td class="fw-semibold">{{ service.name }}</td><td><span class="badge text-bg-{{ 'success' if service.is_active else 'secondary' }}">{{ 'Active' if service.is_active else 'Inactive' }}</span></td><td>{{ service.created_at.strftime('%d %b %Y') }}</td><td><form method="post" action="{{ url_for('service_toggle', service_id=service.id) }}"><button class="btn btn-sm btn-outline-secondary">{{ 'Deactivate' if service.is_active else 'Activate' }}</button></form></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
