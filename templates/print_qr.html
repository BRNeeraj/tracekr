<!doctype html><html><head><meta charset="utf-8"><title>Print QR codes</title><link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet"></head><body class="print-page"><div class="print-toolbar"><button onclick="window.print()">Print all</button><a href="{{ url_for('participants') }}">Back</a></div><div class="qr-grid">{% for p in participants %}<article class="print-qr"><h2>{{ p.name }}</h2><p>{{ p.team_name }} · {{ p.participant_id }}</p><img src="{{ url_for('participant_qr', participant_id=p.participant_id) }}"><strong>{{ p.participant_id }}</strong></article>{% endfor %}</div></body></html>
