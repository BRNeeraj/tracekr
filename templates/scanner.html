{% extends 'base.html' %}{% block content %}<div class="scanner-shell"><p class="eyebrow">Fast counter workflow</p><h1>Scan participant QR</h1><div class="scanner-controls"><label class="form-label">Service being distributed</label><select id="service" class="form-select form-select-lg">{% for service in services %}<option value="{{ service.id }}">{{ service.name }}</option>{% endfor %}</select></div><div id="reader" class="reader"></div><div id="scan-result" class="scan-result idle"><strong>Ready to scan</strong><span>Choose a service and allow camera access.</span></div><div class="scanner-actions"><button id="start-camera" class="btn btn-teal btn-lg">Start live camera</button><label for="qr-image" class="btn btn-outline-secondary btn-lg">Use phone camera</label><input id="qr-image" type="file" accept="image/*" capture="environment" class="visually-hidden"></div><small class="scanner-note">On a phone, use the camera button if live camera access is blocked by the network address.</small></div>{% endblock %}{% block scripts %}<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script src="{{ url_for('static', filename='js/scanner.js') }}"></script>{% endblock %}
